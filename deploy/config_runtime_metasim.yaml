run_farm:
  base_recipe: run-farm-recipes/externally_provisioned.yaml
  recipe_arg_overrides:
    default_platform: XilinxAlveoU250InstanceDeployManager
    default_simulation_dir: /scratch/jfx/fsim-circt/sims/firesim/deploy/run-farm
    default_fpga_db: /scratch/jfx/firesim-db-circt.json
    run_farm_hosts_to_use:
    - localhost: one_fpga_one_metasim_spec
    run_farm_host_specs:
    - one_fpga_one_metasim_spec:
        num_fpgas: 1
        num_metasims: 1
        use_for_switch_only: false
metasimulation:
  metasimulation_enabled: true
  metasimulation_host_simulator: verilator
  metasimulation_only_plusargs: +fesvr-step-size=128 +max-cycles=100000000
  metasimulation_only_vcs_plusargs: +vcs+initreg+0 +vcs+initmem+0
target_config:
  topology: no_net_config
  no_net_num_nodes: 1
  link_latency: 6405
  switching_latency: 10
  net_bandwidth: 200
  profile_interval: -1
  default_hw_config: circt_u250_firesim_rocket_singlecore
  plusarg_passthrough: ''
tracing:
  enable: true
  output_format: 0
  selector: 1
  start: 0
  end: -1
autocounter:
  read_rate: 0
workload:
  workload_name: circt-metasim-bare.json
  terminate_on_completion: true
  suffix_tag: 20261001T094935Z-pid201343-iter362-full-bare
host_debug:
  zero_out_dram: false
  disable_synth_asserts: false
synth_print:
  start: 0
  end: -1
  cycle_prefix: true
